[project]
name = "fmri-denoising"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dicom2nifti>=2.6.2",
    "einops>=0.8.2",
    "lightning>=2.6.5",
    "matplotlib>=3.10.0",
    "monai>=1.5.2",
    "nibabel>=5.4.2",
    "nilearn>=0.13.1",
    "nipype>=1.11.0",
    "numpy>=2.4.6",
    "pytorch-lightning>=2.6.5",
    "torch==2.6.0+cu124",
    "torchaudio==2.6.0+cu124",
    "torchmetrics>=1.9.0",
    "torchvision==0.21.0+cu124",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
